<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recital Studio Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #000000;
        color: #f1f5f9; /* slate-100 */
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        padding-top: 2rem;
      }
      .font-amiri {
        font-family: 'Amiri Quran', serif;
      }
      
      /* --- Pro Slider Style --- */
      .pro-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 6px;
        background: #1e293b; /* slate-800 */
        border-radius: 3px;
        outline: none;
        padding: 0;
        margin: 0;
        cursor: pointer;
        position: relative;
      }
      .pro-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 22px;
        height: 22px;
        background: #f8fafc; /* slate-50 */
        border-radius: 50%;
        border: 2px solid #1e293b; /* slate-800 */
        box-shadow: 0 0 8px rgba(34, 211, 238, 0.5); /* cyan-400 glow */
        transition: transform 0.1s ease-in-out;
        margin-top: -8px; /* Center thumb on the track */
      }
      .pro-slider:active::-webkit-slider-thumb {
        transform: scale(1.1);
      }
      .pro-slider::-moz-range-thumb {
        width: 22px;
        height: 22px;
        background: #f8fafc;
        border-radius: 50%;
        border: 2px solid #1e293b;
        box-shadow: 0 0 8px rgba(34, 211, 238, 0.5);
      }

      /* --- Custom Select Dropdown --- */
      .pro-select-wrapper {
        position: relative;
      }
      .pro-select-wrapper::after {
        content: '▼';
        font-size: 0.625rem;
        color: #94a3b8; /* slate-400 */
        position: absolute;
        right: 1rem;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
      }
      .pro-select {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        background-color: #1e293b; /* slate-800 */
        border: 1px solid #334155; /* slate-700 */
        border-radius: 0.5rem;
        color: white;
        padding: 0.75rem 2.5rem 0.75rem 1rem;
        width: 100%;
        cursor: pointer;
      }
      .pro-select:focus {
        outline: none;
        border-color: #22d3ee; /* cyan-400 */
        box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.3);
      }

      /* --- Main App Container & Card --- */
      .app-container {
        width: 100%;
        max-width: 420px; /* iPhone-like width */
        background: #111827; /* gray-900 */
        border-radius: 2.5rem; /* iOS-like rounded corners */
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255,255,255,0.05);
        border: 1px solid #374151; /* gray-700 */
      }
      
      /* --- Record Button --- */
      .record-button {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background-color: #dc2626; /* red-600 */
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border: 4px solid transparent;
      }
      .record-button:hover {
        background-color: #ef4444; /* red-500 */
      }
      .record-button.recording {
        background-color: #4b5563; /* gray-600 */
        border-color: #dc2626;
      }
      .record-button.recording:hover {
        background-color: #6b7280; /* gray-500 */
      }
      .record-button-icon {
        width: 16px;
        height: 16px;
        background-color: #dc2626;
        border-radius: 4px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .record-button:not(.recording) .record-button-icon {
         width: 0px;
         height: 0px;
         background-color: transparent;
      }
      
      /* --- Effects Drawer Animation --- */
      .effects-drawer {
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        transform: translateY(100%);
      }
      .effects-drawer.open {
        transform: translateY(0);
      }
      
    </style>

{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.25.0",

}
</script>
</head>

    <div id="root"></div>

  </body>
</html>
